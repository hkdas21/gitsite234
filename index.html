<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Identity</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="profile-img">
                <i class="fa-solid fa-user-astronaut"></i>
            </div>

            <div class="content">
                <h1 class="name">Himanshu Kumar</h1>
                <p class="title">Your Learning Buddy</p>

                <p class="bio">
                    Building digital products and learning to control the timeline with Git.
                </p>

                <div class="stats-row">
                    <div class="stat">
                        <span class="number">1</span>
                        <span class="label">Repo</span>
                    </div>
                    <div class="stat">
                        <span class="number">0</span>
                        <span class="label">Commits</span>
                    </div>
                    <div class="stat">
                        <span class="number">0</span>
                        <span class="label">Bugs</span>
                    </div>
                </div>

                <div class="social-links">
                    <a href="#" class="btn primary">View Work</a>
                    <a href="#" class="btn secondary">Contact</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
